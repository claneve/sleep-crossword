<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep Crossword</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: Dark blue background with soft stars and brighter four-point sparkles */
:root {
  color-scheme: dark;
  --bg: #0E1230;
  --panel: #161B3D;
  --cell-bg: #1C2250;
  --ink: #C6DBF0;
  --ink-2: #C3B6DE;
  --grid: #3B4785;
  --rule: #293266;
  --lamp-fill: #C6DBF0;
  --lamp-strong: #C6DBF0;
  --lamp-ink: #0E1230;
  --focus: #C6DBF0;
  --hl-soft: rgba(198, 219, 240, 0.08);
  --hl: rgba(198, 219, 240, 0.18);
  --hl-strong: rgba(198, 219, 240, 0.40);
  --wrong: #FF9D95;
  --reveal: #C6DBF0;
  --f-ui: "Outfit", "Segoe UI", system-ui, sans-serif;
  --f-text: "Outfit", Georgia, sans-serif;
  --cs: clamp(15px, calc((100vw - 52px) / 17), 36px);
}

@media (min-width: 1040px) {
  :root { --cs: 34px; }
}

*, *::before, *::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  background-color: var(--bg);

  /*
    Star field inspired by the reference image:
    - lots of tiny soft stars
    - a handful of brighter points
    - several delicate four-point sparkles
    - soft glow around the brighter stars
  */
  background-image:

    /* Tiny soft stars */
    radial-gradient(circle 1px at 12px 30px,
      rgba(198,219,240,0.58) 0 55%,
      transparent 100%),

    radial-gradient(circle 1.4px at 78px 112px,
      rgba(198,219,240,0.42) 0 55%,
      transparent 100%),

    radial-gradient(circle 1px at 122px 58px,
      rgba(198,219,240,0.35) 0 55%,
      transparent 100%),

    radial-gradient(circle 1.5px at 206px 84px,
      rgba(198,219,240,0.50) 0 55%,
      transparent 100%),

    radial-gradient(circle 1px at 264px 170px,
      rgba(198,219,240,0.38) 0 55%,
      transparent 100%),

    radial-gradient(circle 1.2px at 318px 64px,
      rgba(198,219,240,0.45) 0 55%,
      transparent 100%),

    radial-gradient(circle 1px at 390px 132px,
      rgba(198,219,240,0.34) 0 55%,
      transparent 100%),

    radial-gradient(circle 1.4px at 452px 238px,
      rgba(198,219,240,0.48) 0 55%,
      transparent 100%),

    radial-gradient(circle 1px at 522px 92px,
      rgba(198,219,240,0.40) 0 55%,
      transparent 100%),

    radial-gradient(circle 1.2px at 604px 184px,
      rgba(198,219,240,0.34) 0 55%,
      transparent 100%),

    radial-gradient(circle 1px at 676px 52px,
      rgba(198,219,240,0.46) 0 55%,
      transparent 100%),

    radial-gradient(circle 1.5px at 738px 224px,
      rgba(198,219,240,0.42) 0 55%,
      transparent 100%),

    radial-gradient(circle 1px at 812px 116px,
      rgba(198,219,240,0.34) 0 55%,
      transparent 100%),

    radial-gradient(circle 1.3px at 874px 282px,
      rgba(198,219,240,0.46) 0 55%,
      transparent 100%),

    /* Soft halos behind brighter sparkles */
    radial-gradient(circle 17px at 188px 42px,
      rgba(198,219,240,0.08) 0%,
      rgba(198,219,240,0.035) 28%,
      transparent 70%),

    radial-gradient(circle 20px at 430px 90px,
      rgba(198,219,240,0.07) 0%,
      rgba(198,219,240,0.03) 30%,
      transparent 72%),

    radial-gradient(circle 18px at 748px 138px,
      rgba(198,219,240,0.07) 0%,
      rgba(198,219,240,0.03) 30%,
      transparent 72%),

    /* Four-point sparkle #1: vertical */
    radial-gradient(ellipse 1.2px 15px at 188px 42px,
      rgba(198,219,240,0.72) 0%,
      rgba(198,219,240,0.42) 35%,
      transparent 100%),

    /* Four-point sparkle #1: horizontal */
    radial-gradient(ellipse 15px 1.2px at 188px 42px,
      rgba(198,219,240,0.72) 0%,
      rgba(198,219,240,0.42) 35%,
      transparent 100%),

    /* Four-point sparkle #2: vertical */
    radial-gradient(ellipse 1px 12px at 430px 90px,
      rgba(198,219,240,0.66) 0%,
      rgba(198,219,240,0.38) 35%,
      transparent 100%),

    /* Four-point sparkle #2: horizontal */
    radial-gradient(ellipse 12px 1px at 430px 90px,
      rgba(198,219,240,0.66) 0%,
      rgba(198,219,240,0.38) 35%,
      transparent 100%),

    /* Four-point sparkle #3: vertical */
    radial-gradient(ellipse 1.1px 16px at 748px 138px,
      rgba(198,219,240,0.68) 0%,
      rgba(198,219,240,0.40) 35%,
      transparent 100%),

    /* Four-point sparkle #3: horizontal */
    radial-gradient(ellipse 16px 1.1px at 748px 138px,
      rgba(198,219,240,0.68) 0%,
      rgba(198,219,240,0.40) 35%,
      transparent 100%),

    /* Small extra sparkle */
    radial-gradient(ellipse 0.8px 8px at 610px 270px,
      rgba(198,219,240,0.52) 0%,
      rgba(198,219,240,0.28) 40%,
      transparent 100%),

    radial-gradient(ellipse 8px 0.8px at 610px 270px,
      rgba(198,219,240,0.52) 0%,
      rgba(198,219,240,0.28) 40%,
      transparent 100%);

  background-repeat: repeat;
  background-size: 900px 400px;

  color: var(--ink);
  font-family: var(--f-text);
  font-size: 1.06rem;
  line-height: 1.45;
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}

.page {
  max-width: 1160px;
  margin-inline: auto;
  display: grid;
  gap: 28px;
}

header {
  display: grid;
  gap: 10px;
}

.eyebrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  font: 600 0.74rem/1 var(--f-ui);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-2);
}

.progress {
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

h1 {
  margin: 0;
  font: 700 clamp(1.9rem, 5.2vw, 2.9rem)/1.05 var(--f-ui);
  letter-spacing: -0.02em;
  text-wrap: balance;
  color: #FFFFFF;
}

.sub {
  margin: 0;
  max-width: 60ch;
  color: var(--ink-2);
}

.btn {
  font: 600 0.85rem/1 var(--f-ui);
  color: var(--bg);
  background: var(--lamp-fill);
  border: 1.5px solid var(--lamp-strong);
  border-radius: 999px;
  padding: 9px 14px;
  cursor: pointer;
}

.btn:hover:not(:disabled) {
  background: #C6DBF0;
}

.btn:focus-visible,
.crow:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.btn.ghost {
  border-color: var(--grid);
  color: var(--ink);
  background: var(--panel);
}

.layout {
  display: grid;
  gap: 32px;
  grid-template-columns: minmax(0, 1fr);
}

@media (min-width: 1040px) {
  .layout {
    grid-template-columns: auto minmax(320px, 1fr);
    gap: 52px;
    align-items: start;
  }
}

.board {
  display: grid;
  gap: 16px;
  min-width: 0;
  align-content: start;
}

.cluebar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 6;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 12px 14px;
  display: grid;
  gap: 8px;
}

@media (min-width: 1040px) {
  .cluebar {
    position: static;
  }
}

.cb-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
}

.cb-label {
  font: 700 0.8rem/1 var(--f-ui);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink);
}

.cb-label .len {
  text-transform: none;
  letter-spacing: 0;
  font-weight: 500;
  color: var(--ink-2);
  margin-left: 6px;
}

.cb-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.cb-text {
  margin: 0;
  color: #FFFFFF;
}

.cb-cue {
  margin: 0;
  padding: 8px 10px;
  background: var(--hl-soft);
  font-style: italic;
  color: var(--ink);
}

.cb-ans {
  margin: 0;
  padding: 8px 10px;
  background: var(--hl-soft);
  font: 700 1rem/1.3 var(--f-ui);
  letter-spacing: 0.14em;
  color: var(--lamp-fill);
}

.cue-tag {
  font: 700 0.68rem/1 var(--f-ui);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-style: normal;
  margin-right: 8px;
  color: var(--ink-2);
}

.gridwrap {
  overflow-x: auto;
  padding: 2px;
}

.grid {
  position: relative;
  display: grid;
  width: max-content;
  grid-template-columns: repeat(17, var(--cs));
  grid-auto-rows: var(--cs);
  gap: 1px;
}

.cell {
  position: relative;
  display: grid;
  place-items: center;
  background: var(--cell-bg);
  outline: 1px solid var(--grid);
  cursor: pointer;
  --ov: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.cell.lamp {
  background: var(--lamp-fill);
}

.cell::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--ov);
  pointer-events: none;
}

.cell.word {
  --ov: var(--hl);
}

.cell.active {
  --ov: var(--hl-strong);
  outline: 2px solid var(--focus);
  outline-offset: -1px;
  z-index: 2;
}

.cell.wrong::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    to top right,
    transparent calc(50% - 1px),
    var(--wrong) calc(50% - 1px),
    var(--wrong) calc(50% + 1px),
    transparent calc(50% + 1px)
  );
}

.n {
  position: absolute;
  top: 1px;
  left: 2px;
  font: 600 max(6px, calc(var(--cs) * 0.3))/1 var(--f-ui);
  color: var(--ink-2);
}

.ch {
  position: relative;
  font: 600 calc(var(--cs) * 0.56)/1 var(--f-ui);
  color: #FFFFFF;
}

.cell.lamp .ch {
  color: var(--lamp-ink);
}

.cell.lamp .n {
  color: var(--lamp-ink);
}

.ord {
  position: absolute;
  right: 2px;
  bottom: 1px;
  font: 700 max(6px, calc(var(--cs) * 0.28))/1 var(--f-ui);
  color: var(--lamp-ink);
}

.cell.wrong .ch {
  color: var(--wrong);
}

.kbd {
  position: absolute;
  width: var(--cs);
  height: var(--cs);
  padding: 0;
  border: 0;
  margin: 0;
  opacity: 0;
  pointer-events: none;
  font-size: 16px;
  caret-color: transparent;
  background: transparent;
  color: transparent;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
}

.status {
  font-size: 0.95rem;
  color: var(--ink);
  min-height: 1.4em;
}

.how {
  margin: 0;
  font-size: 0.9rem;
  color: var(--ink-2);
}

.mystery {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 16px;
  display: grid;
  gap: 12px;
}

.mystery h2 {
  margin: 0;
  font: 700 1.05rem/1.2 var(--f-ui);
  color: #FFFFFF;
}

.mystery p {
  margin: 0;
  color: var(--ink);
}

.mrow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
}

.mword {
  display: flex;
  gap: 4px;
}

.mbox {
  position: relative;
  display: grid;
  place-items: center;
  width: 34px;
  height: 42px;
  background: var(--lamp-fill);
  outline: 1px solid var(--grid);
}

.mbox.found {
  background: var(--lamp-strong);
}

.mbox .ch {
  font-size: 1.35rem;
  color: var(--lamp-ink);
}

.mi {
  position: absolute;
  top: 2px;
  left: 4px;
  font: 700 0.64rem/1 var(--f-ui);
  color: var(--lamp-ink);
}

.mclue {
  color: var(--ink-2);
}

.mresult {
  font-weight: 600;
  color: var(--lamp-fill);
}

.clues {
  display: grid;
  gap: 26px;
  min-width: 0;
}

.clues h2 {
  margin: 0 0 8px;
  padding-bottom: 6px;
  border-bottom: 1.5px solid var(--rule);
  font: 700 0.8rem/1 var(--f-ui);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
}

.clues ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 4px;
}

.crow {
  display: grid;
  grid-template-columns: 2.1rem minmax(0, 1fr);
  gap: 4px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 0;
  padding: 5px 6px 5px 0;
  cursor: pointer;
}

.crow.cross {
  background: var(--hl-soft);
}

.crow.active {
  background: var(--hl);
  color: #FFFFFF;
}

.crow.solved .txt {
  color: var(--ink-2);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

.num {
  font: 700 0.95rem/1.45 var(--f-ui);
  font-variant-numeric: tabular-nums;
  text-align: right;
  padding-right: 6px;
  color: var(--ink-2);
}

.len {
  color: var(--ink-2);
  font-style: italic;
  white-space: nowrap;
}

.cue {
  margin: 0 0 4px 2.1rem;
  padding: 0 0 0 4px;
  font-style: italic;
  color: var(--ink-2);
  font-size: 0.97rem;
}

.ans {
  margin: 0 0 4px 2.1rem;
  padding: 0 0 0 4px;
  font: 700 0.9rem/1.3 var(--f-ui);
  letter-spacing: 0.14em;
  color: var(--lamp-fill);
}

.author {
  color: var(--ink-2);
  font-size: 0.85rem;
  border-top: 1px solid var(--rule);
  padding-top: 12px;
}

.author-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 6px;
}

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---- cozy bedroom illustration (grows with every solved answer) ---- */

.room {
  margin: 0;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
}

.room-svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 70vh; /* tall pictures are scaled down to fit */
}

.room-svg [data-step] {
  opacity: 0;
  transform: none;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}

.room-svg [data-step].on {
  opacity: 1;
  transform: none;
}

.room.anim .room-svg [data-step] {
  transition: opacity 0.7s ease, transform 0.7s ease;
}

.room-svg .rm-full {
  opacity: 0;
}

.room.done .room-svg .rm-full {
  opacity: 1;
}

.room.anim .room-svg .rm-full {
  transition: opacity 0.9s ease 0.5s;
}

.room-cap {
  margin: 0;
  padding: 10px 14px 12px;
  font-size: 0.9rem;
  color: var(--ink-2);
  border-top: 1px solid var(--rule);
}

@media (prefers-reduced-motion: reduce) {
  .room.anim .room-svg [data-step] {
    transition: none;
  }
}
</style>
</head>
<body>
<div class="page" id="page">
  <header>
    <div class="eyebrow"><span>16 clues</span><span>1 mystery phrase</span><span class="progress" id="progress"></span></div>
    <h1>Sleep Crossword</h1>
    <p class="sub">Fill in the grid, then read the shaded squares in order 1 to 12 to reveal the mystery phrase.</p>
  </header>

  <main class="layout">
    <section class="board">
      <div class="cluebar" id="cluebar">
        <div class="cb-top">
          <div class="cb-label"><span id="cbLabel"></span><span class="len" id="cbLen"></span></div>
          <div class="cb-actions">
            <button type="button" class="btn" id="cueBtn">Extra cue</button>
            <button type="button" class="btn" id="ansBtn">Show answer</button>
          </div>
        </div>
        <p class="cb-text" id="cbText" aria-live="polite"></p>
        <p class="cb-cue" id="cbCue" hidden></p>
        <p class="cb-ans" id="cbAns" hidden></p>
      </div>

      <div class="gridwrap">
        <div class="grid" id="grid" role="application" aria-label="Crossword grid. Type letters to fill squares. Arrow keys move, Space switches direction, Enter jumps to the next clue.">
          <input class="kbd" id="kbd" type="text" aria-label="Crossword input" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="next">
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn" id="checkBtn">Check</button>
        <button type="button" class="btn ghost" id="resetBtn">Start over</button>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
      <p class="how">Click a square and type. Arrow keys move, Space switches direction, Enter jumps to the next clue.</p>

      <div class="mystery">
        <h2>Mystery phrase</h2>
        <div class="mrow" id="mrow" aria-label="Mystery phrase, 12 letters"></div>
        <p class="mclue" id="mclue"></p>
        <p class="mresult" id="mresult" hidden></p>
      </div>
    </section>

    <section class="clues">

<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById("puzzle").textContent);

  function $(id) {
    return document.getElementById(id);
  }

  function key(r, c) {
    return r + "," + c;
  }

  function split(k) {
    var p = k.split(",");
    return { r: +p[0], c: +p[1] };
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  var page = $("page"),
      grid = $("grid"),
      kbd = $("kbd"),
      statusEl = $("status");

  var cells = P.cells,
      words = P.words,
      N = words.length;

  var cellInfo = {},
      cellEls = {};

  cells.forEach(function (c) {
    cellInfo[key(c.r, c.c)] = {
      r: c.r,
      c: c.c,
      ch: c.ch,
      w: {}
    };
  });

  words.forEach(function (w, i) {
    w.cells = [];

    for (var k = 0; k < w.answer.length; k++) {
      var r = w.r + (w.dir === "D" ? k : 0);
      var c = w.c + (w.dir === "A" ? k : 0);

      w.cells.push(key(r, c));
      cellInfo[key(r, c)].w[w.dir] = i;
    }
  });

  var mysteryKeys = cells
    .filter(function (c) {
      return c.m;
    })
    .sort(function (a, b) {
      return a.m - b.m;
    })
    .map(function (c) {
      return key(c.r, c.c);
    });

  var mysteryPhrase = P.mystery.words.join(" ");

  // ---- build the grid -----------------------------------------------------

  cells.forEach(function (c) {
    var d = el("div", "cell" + (c.m ? " lamp" : ""));

    d.dataset.r = c.r;
    d.dataset.c = c.c;

    d.style.gridRow = String(c.r + 1);
    d.style.gridColumn = String(c.c + 1);

    if (c.n) {
      d.appendChild(el("span", "n", String(c.n)));
    }

    var ch = el("span", "ch");
    d.appendChild(ch);

    if (c.m) {
      d.appendChild(el("span", "ord", String(c.m)));
    }

    grid.appendChild(d);

    cellEls[key(c.r, c.c)] = {
      el: d,
      ch: ch
    };
  });

  // ---- mystery boxes ------------------------------------------------------

  var mboxes = [],
      mi = 0;

  P.mystery.groups.forEach(function (len) {
    var g = el("div", "mword");

    for (var i = 0; i < len; i++) {
      var b = el("div", "mbox");

      b.appendChild(el("span", "mi", String(mi + 1)));

      var ch = el("span", "ch");
      b.appendChild(ch);

      g.appendChild(b);

      mboxes.push({
        box: b,
        ch: ch
      });

      mi++;
    }

    $("mrow").appendChild(g);
  });

  $("mclue").appendChild(
    document.createTextNode(P.mystery.clue + " ")
  );

  $("mclue").appendChild(
    el("span", "len", "(" + P.mystery.enum + ")")
  );

  // ---- clue lists ---------------------------------------------------------

  var rows = [];

  words.forEach(function (w, i) {
    var li = document.createElement("li");

    var b = el("button", "crow");
    b.type = "button";
    b.dataset.i = i;

    b.appendChild(el("span", "num", String(w.n)));

    var t = el("span", "txt");

    t.appendChild(
      document.createTextNode(w.clue + " ")
    );

    t.appendChild(
      el("span", "len", "(" + w.enum + ")")
    );

    t.appendChild(
      el("span", "sr", " Solved")
    );

    t.lastChild.hidden = true;

    b.appendChild(t);

    var cue = el("p", "cue");
    cue.hidden = true;

    var ans = el("p", "ans");
    ans.hidden = true;

    li.appendChild(b);
    li.appendChild(cue);
    li.appendChild(ans);

    $(w.dir === "A" ? "acrossList" : "downList").appendChild(li);

    rows.push({
      btn: b,
      cue: cue,
      ans: ans,
      solvedTag: t.lastChild
    });
  });

  // ---- state --------------------------------------------------------------

  var STORE_KEY =
    "sleep-crossword:" +
    words.map(function (w) {
      return w.answer;
    }).join("-");

  var S = {
    entry: {},
    cues: {},
    wordsShown: {},
    wrong: {},
    active: null,
    dir: "A"
  };

  (function load() {
    try {
      var d = JSON.parse(
        localStorage.getItem(STORE_KEY) || "null"
      );

      if (!d) return;

      Object.keys(d.entry || {}).forEach(function (k) {
        if (
          cellInfo[k] &&
          /^[A-Z]$/.test(d.entry[k])
        ) {
          S.entry[k] = d.entry[k];
        }
      });

      Object.keys(d.cues || {}).forEach(function (i) {
        if (words[+i]) {
          S.cues[i] = true;
        }
      });

      Object.keys(d.wordsShown || {}).forEach(function (i) {
        if (words[+i]) {
          S.wordsShown[i] = true;
        }
      });

    } catch (e) {
      /* private window or blocked storage: the game still works */
    }
  })();

  function save() {
    try {
      localStorage.setItem(
        STORE_KEY,
        JSON.stringify({
          entry: S.entry,
          cues: S.cues,
          wordsShown: S.wordsShown
        })
      );
    } catch (e) {
      /* ignore */
    }
  }

  S.active = split(words[0].cells[0]);
  S.dir = words[0].dir;

  function currentIndex() {
    var info = cellInfo[
      key(S.active.r, S.active.c)
    ];

    var i = info.w[S.dir];

    if (i === undefined) {
      S.dir = S.dir === "A" ? "D" : "A";
      i = info.w[S.dir];
    }

    return i;
  }

  function wordSolved(i) {
    return words[i].cells.every(function (k) {
      return S.entry[k] === cellInfo[k].ch;
    });
  }

  function label(i) {
    return (
      words[i].n +
      " " +
      (words[i].dir === "A"
        ? "Horizontal"
        : "Vertical")
    );
  }

  function spaced(w) {
    var out = [];
    var pos = 0;

    w.enum.split(",").forEach(function (n) {
      out.push(
        w.answer.substr(pos, +n)
      );
      pos += +n;
    });

    return out.join(" ");
  }

  function setStatus(msg) {
    statusEl.textContent = msg || "";
  }

  // ---- puzzle picture -----------------------------------------
  // One puzzle piece (data-step 1 to 16) appears per correctly solved answer.

  var roomEl = $("room"),
      roomCap = $("roomCap"),
      roomParts = Array.prototype.slice.call(
        roomEl.querySelectorAll("[data-step]")
      );

  function updateRoom(solved) {
    roomParts.forEach(function (p) {
      p.classList.toggle(
        "on",
        +p.getAttribute("data-step") <= solved
      );
    });

    roomEl.classList.toggle("done", solved >= N);

    roomCap.textContent =
      solved === 0
        ? "Solve an answer to reveal the first puzzle piece."
        : solved >= N
          ? "The picture is complete. Sleep well!"
          : solved + " of " + N + " puzzle pieces revealed.";
  }

  // ---- rendering ----------------------------------------------------------

  function render() {
    var a = S.active,
        ci = currentIndex(),
        cur = words[ci];

    var inWord = {};

    cur.cells.forEach(function (k) {
      inWord[k] = true;
    });

    var crossIdx =
      cellInfo[key(a.r, a.c)].w[
        S.dir === "A" ? "D" : "A"
      ];

    cells.forEach(function (c) {
      var k = key(c.r, c.c),
          ref = cellEls[k];

      ref.ch.textContent =
        S.entry[k] || "";

      var cls =
        "cell" +
        (c.m ? " lamp" : "");

      if (inWord[k]) {
        cls += " word";
      }

      if (
        a.r === c.r &&
        a.c === c.c
      ) {
        cls += " active";
      }

      if (S.wrong[k]) {
        cls += " wrong";
      }

      ref.el.className = cls;
    });

    var found = mysteryKeys.every(function (k) {
      return S.entry[k] === cellInfo[k].ch;
    });

    mysteryKeys.forEach(function (k, i) {
      mboxes[i].ch.textContent =
        S.entry[k] || "";

      mboxes[i].box.className =
        "mbox" +
        (found ? " found" : "");
    });

    $("cbLabel").textContent =
      label(ci);

    $("cbLen").textContent =
      "(" + cur.enum + ")";

    $("cbText").textContent =
      cur.clue;

    var cueEl = $("cbCue");

    if (S.cues[ci]) {
      cueEl.hidden = false;
      cueEl.textContent = "";

      cueEl.appendChild(
        el("span", "cue-tag", "Extra cue")
      );

      cueEl.appendChild(
        document.createTextNode(
          cur.cue ||
          "No extra cue has been written for this clue yet."
        )
      );

    } else {
      cueEl.hidden = true;
    }

    var ansEl = $("cbAns");

    if (S.wordsShown[ci]) {
      ansEl.hidden = false;
      ansEl.textContent = "";

      ansEl.appendChild(
        el("span", "cue-tag", "Answer")
      );

      ansEl.appendChild(
        document.createTextNode(
          spaced(cur)
        )
      );

    } else {
      ansEl.hidden = true;
    }

    var solved = 0;

    words.forEach(function (w, i) {
      var ok = wordSolved(i);

      if (ok) {
        solved++;
      }

      var cls = "crow";

      if (i === ci) {
        cls += " active";
      } else if (i === crossIdx) {
        cls += " cross";
      }

      if (ok) {
        cls += " solved";
      }

      rows[i].btn.className = cls;
      rows[i].solvedTag.hidden = !ok;
      rows[i].cue.hidden = true;
      rows[i].ans.hidden = !S.wordsShown[i];

      if (S.wordsShown[i]) {
        rows[i].ans.textContent =
          spaced(w);
      }
    });

    $("progress").textContent =
      solved + " of " + N + " answers";

    updateRoom(solved);

    var all = cells.every(function (c) {
      return (
        S.entry[key(c.r, c.c)] === c.ch
      );
    });

    var res = $("mresult");

    if (all) {
      res.textContent =
        "Congratulations you completed the puzzle and found the mystery phrase!";
      res.hidden = false;
    } else {
      res.hidden = true;
    }

    kbd.style.left =
      "calc(" +
      a.c +
      " * (var(--cs) + 1px))";

    kbd.style.top =
      "calc(" +
      a.r +
      " * (var(--cs) + 1px))";
  }

  function update() {
    render();
    save();
  }

  // ---- selection and movement --------------------------------------------

  function focusKbd() {
    try {
      kbd.focus({
        preventScroll: true
      });
    } catch (e) {
      kbd.focus();
    }
  }

  function selectCell(r, c, fromClick) {
    var info = cellInfo[key(r, c)];

    if (!info) return;

    if (
      fromClick &&
      S.active.r === r &&
      S.active.c === c
    ) {
      var other =
        S.dir === "A" ? "D" : "A";

      if (info.w[other] !== undefined) {
        S.dir = other;
      }

    } else if (
      info.w[S.dir] === undefined
    ) {
      S.dir =
        S.dir === "A" ? "D" : "A";
    }

    S.active = {
      r: r,
      c: c
    };

    render();
  }

  function selectWord(i) {
    var w = words[i],
        target = w.cells[0];

    for (
      var k = 0;
      k < w.cells.length;
      k++
    ) {
      if (!S.entry[w.cells[k]]) {
        target = w.cells[k];
        break;
      }
    }

    S.dir = w.dir;
    S.active = split(target);

    render();
  }

  function step(delta) {
    var i = currentIndex();

    selectWord(
      (i + delta + N) % N
    );
  }

  function arrow(dr, dc) {
    var r = S.active.r + dr,
        c = S.active.c + dc;

    while (
      r >= 0 &&
      r < P.rows &&
      c >= 0 &&
      c < P.cols
    ) {
      var info =
        cellInfo[key(r, c)];

      if (info) {
        var axis =
          dr !== 0 ? "D" : "A";

        if (
          info.w[axis] !== undefined
        ) {
          S.dir = axis;
        }

        S.active = {
          r: r,
          c: c
        };

        if (
          info.w[S.dir] === undefined
        ) {
          S.dir =
            S.dir === "A"
              ? "D"
              : "A";
        }

        render();
        return;
      }

      r += dr;
      c += dc;
    }
  }

  // ---- typing -------------------------------------------------------------

  function typeLetter(ch) {
    var k = key(
      S.active.r,
      S.active.c
    );

    S.entry[k] = ch;
    S.wrong = {};

    setStatus("");

    var w = words[currentIndex()],
        pos = w.cells.indexOf(k);

    if (
      pos < w.cells.length - 1
    ) {
      S.active =
        split(w.cells[pos + 1]);
    }

    update();
  }

  function backspace() {
    var k = key(
      S.active.r,
      S.active.c
    );

    S.wrong = {};
    setStatus("");

    if (S.entry[k]) {
      delete S.entry[k];

    } else {
      var w = words[currentIndex()],
          pos = w.cells.indexOf(k);

      if (pos > 0) {
        var pk = w.cells[pos - 1];

        S.active = split(pk);
        delete S.entry[pk];
      }
    }

    update();
  }

  function clearCell() {
    var k = key(
      S.active.r,
      S.active.c
    );

    delete S.entry[k];
    S.wrong = {};

    update();
  }

  var SENT = "​";

  function resetKbd() {
    kbd.value = SENT;
  }

  resetKbd();

  kbd.addEventListener(
    "input",
    function (e) {
      var t = e.inputType || "",
          v = kbd.value;

      if (
        t.indexOf("delete") === 0 ||
        v.length === 0
      ) {
        backspace();
      } else {
        var last = v
          .replace(/​/g, "")
          .slice(-1);

        if (/^[A-Za-z]$/.test(last)) {
          typeLetter(
            last.toUpperCase()
          );
        }
      }

      resetKbd();
    }
  );

  kbd.addEventListener(
    "keydown",
    function (e) {
      if (
        e.ctrlKey ||
        e.metaKey ||
        e.altKey
      ) {
        return;
      }

      switch (e.key) {
        case "ArrowLeft":
          e.preventDefault();
          arrow(0, -1);
          break;

        case "ArrowRight":
          e.preventDefault();
          arrow(0, 1);
          break;

        case "ArrowUp":
          e.preventDefault();
          arrow(-1, 0);
          break;

        case "ArrowDown":
          e.preventDefault();
          arrow(1, 0);
          break;

        case "Backspace":
          e.preventDefault();
          backspace();
          break;

        case "Delete":
          e.preventDefault();
          clearCell();
          break;

        case " ":
          e.preventDefault();
          selectCell(
            S.active.r,
            S.active.c,
            true
          );
          break;

        case "Enter":
          e.preventDefault();
          step(
            e.shiftKey ? -1 : 1
          );
          break;
      }
    }
  );

  kbd.addEventListener(
    "focus",
    function () {
      grid.classList.add("focused");
    }
  );

  kbd.addEventListener(
    "blur",
    function () {
      grid.classList.remove("focused");
    }
  );

  grid.addEventListener(
    "click",
    function (e) {
      var d =
        e.target.closest(".cell");

      if (!d) return;

      selectCell(
        +d.dataset.r,
        +d.dataset.c,
        true
      );

      focusKbd();
    }
  );

  rows.forEach(function (row, i) {
    row.btn.addEventListener(
      "click",
      function () {
        selectWord(i);
        focusKbd();
      }
    );
  });

  // ---- buttons ------------------------------------------------------------

  $("cueBtn").addEventListener(
    "click",
    function () {
      var i = currentIndex();

      S.cues[i] = true;
      setStatus("");
      update();
    }
  );

  $("ansBtn").addEventListener(
    "click",
    function () {
      S.wordsShown[
        currentIndex()
      ] = true;

      setStatus("");
      update();
    }
  );

  $("checkBtn").addEventListener(
    "click",
    function () {
      var bad = 0,
          filled = 0;

      S.wrong = {};

      cells.forEach(function (c) {
        var k = key(c.r, c.c);

        if (!S.entry[k]) return;

        filled++;

        if (
          S.entry[k] !== c.ch
        ) {
          S.wrong[k] = true;
          bad++;
        }
      });

      if (!filled) {
        setStatus(
          "Nothing to check yet."
        );
      } else if (!bad) {
        setStatus(
          "Everything you have entered so far is correct."
        );
      } else {
        setStatus(
          bad +
          (bad === 1
            ? " letter does"
            : " letters do") +
          " not match. They are crossed out in the grid."
        );
      }

      render();
    }
  );

  var resetBtn = $("resetBtn"),
      armed = false,
      armTimer = null;

  function disarm() {
    armed = false;
    resetBtn.textContent =
      "Start over";

    clearTimeout(armTimer);
  }

  resetBtn.addEventListener(
    "click",
    function () {
      if (!armed) {
        armed = true;

        resetBtn.textContent =
          "Click again to clear everything";

        armTimer = setTimeout(
          disarm,
          4000
        );

        return;
      }

      disarm();

      S.entry = {};
      S.cues = {};
      S.wordsShown = {};
      S.wrong = {};

      S.active =
        split(words[0].cells[0]);

      S.dir = words[0].dir;

      setStatus(
        "Grid cleared."
      );

      update();
    }
  );

  $("solveAll").addEventListener(
    "click",
    function () {
      cells.forEach(function (c) {
        S.entry[
          key(c.r, c.c)
        ] = c.ch;
      });

      S.wrong = {};
      setStatus("");
      update();
    }
  );

  $("clearAll").addEventListener(
    "click",
    function () {
      S.entry = {};
      S.cues = {};
      S.wordsShown = {};
      S.wrong = {};

      setStatus("");
      update();
    }
  );

  render();

  // switch the fade-in on only after the first paint, so a restored game does not animate
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      roomEl.classList.add("anim");
    });
  });
})();
</script>
</body>
</html>
